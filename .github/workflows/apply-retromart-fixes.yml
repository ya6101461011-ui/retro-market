name: Apply RETROMART catalog fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-retromart-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply catalog fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          products = Path('lib/products.ts')
          text = products.read_text(encoding='utf-8')

          text = text.replace(
              'id: "apple-watch-ultra",\n\n    name: "Apple Watch Ultra",\n\n    brand: "Apple",\n\n    category: "手機",',
              'id: "apple-watch-ultra",\n\n    name: "Apple Watch Ultra",\n\n    brand: "Apple",\n\n    category: "智慧手錶",',
          )

          text = text.replace(
              'id: "dji-drone",\n\n    name: "DJI 旗艦空拍機",\n\n    brand: "DJI",\n\n    category: "相機",',
              'id: "dji-drone",\n\n    name: "DJI 旗艦空拍機",\n\n    brand: "DJI",\n\n    category: "空拍機",',
          )

          if 'id: "gaming-desktop-rtx-5080"' not in text:
              desktop = '''

  // =====================================================
  // RETROMART catalog: desktop PC
  // =====================================================

  {
    id: "gaming-desktop-rtx-5080",

    name: "RETROMART RTX 5080 旗艦電競桌機",

    brand: "RETROMART",

    category: "電腦",

    price: 89900,

    oldPrice: 99900,

    sold: 1268,

    stock: 9,

    rating: 4.8,

    reviewCount: 428,

    tag: "旗艦",

    image:
      "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=1200&q=90",

    images: [
      "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=1200&q=90",
      "https://images.unsplash.com/photo-1593640495253-23196b27a87f?w=1200&q=90",
    ],

    description:
      "高效能桌上型電競電腦，適合 4K 遊戲、影音創作與高效能運算需求。",

    specs: [
      {
        label: "品牌",
        value: "RETROMART",
      },
      {
        label: "產品類型",
        value: "桌上型電腦",
      },
      {
        label: "顯示卡",
        value: "NVIDIA GeForce RTX 5080",
      },
      {
        label: "處理器",
        value: "Intel Core Ultra 7",
      },
      {
        label: "記憶體",
        value: "32GB DDR5",
      },
      {
        label: "儲存",
        value: "2TB NVMe SSD",
      },
    ],
  },
'''
              marker = '\n];'
              if marker not in text:
                  raise SystemExit('Could not find products array terminator')
              text = text.replace(marker, desktop + marker, 1)

          products.write_text(text, encoding='utf-8')
          print('Catalog fixes applied')
          PY

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/products.ts
          if git diff --cached --quiet; then
            echo "No catalog changes needed"
            exit 0
          fi
          git commit -m "fix: correct product categories and add desktop PC"
          git push
